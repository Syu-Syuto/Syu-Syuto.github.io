<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="900" viewBox="0 0 1312 900" role="img" aria-labelledby="title desc">
  <title id="title">漢字小テスト作成ツールの画面イメージ</title>
  <desc id="desc">問題文とJSONを読み込む入力欄、読みと書きの切り替え、縦書きの印刷プレビュー</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d7dfdc" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#344259" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1312" height="900" fill="#e8f1ed"/>
  <rect width="1312" height="900" fill="url(#grid)" opacity=".62"/>
  <path d="M1068 15 1249 6 1259 91 1080 102Z" fill="#f3d8b2" opacity=".9"/>
  <text x="1107" y="68" fill="#4b6270" font-family="'Yu Gothic',sans-serif" font-size="31" font-weight="700" transform="rotate(-3 1107 68)">つくって、印刷。</text>
  <g filter="url(#shadow)">
    <rect x="66" y="70" width="1180" height="766" rx="14" fill="#fcfcfa"/>
    <path d="M66 146H1246" stroke="#d5dde0" stroke-width="2"/>
    <text x="101" y="123" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="48" font-weight="800">漢字小テスト作成ツール</text>
    <rect x="655" y="91" width="136" height="39" rx="18" fill="#e3ecf1"/>
    <text x="679" y="119" fill="#446b83" font-family="sans-serif" font-size="26" font-weight="700">Ver. 11</text>
    <circle cx="1185" cy="110" r="9" fill="#e3c487"/>
    <circle cx="1153" cy="110" r="9" fill="#d5e6df"/>
    <circle cx="1121" cy="110" r="9" fill="#efd8dd"/>

    <rect x="93" y="173" width="487" height="626" rx="12" fill="#f5f7f5" stroke="#d7e1df" stroke-width="2"/>
    <text x="122" y="219" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="31" font-weight="800">01  問題を用意</text>
    <text x="124" y="269" fill="#647587" font-family="'Yu Gothic',sans-serif" font-size="24">タイトル・学年・実施日</text>
    <rect x="121" y="287" width="428" height="58" rx="7" fill="#fff" stroke="#bccbd1" stroke-width="2"/>
    <text x="145" y="326" fill="#526677" font-family="'Yu Gothic',sans-serif" font-size="27">漢字の総テスト</text>
    <text x="124" y="397" fill="#647587" font-family="'Yu Gothic',sans-serif" font-size="24">問題文を入力 / JSONを読み込む</text>
    <rect x="121" y="414" width="428" height="181" rx="7" fill="#fff" stroke="#bccbd1" stroke-width="2"/>
    <text x="147" y="463" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">夜空の星を観察する。</text>
    <text x="147" y="509" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">新しい道を探す。</text>
    <text x="147" y="555" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">試合の結果を伝える。</text>
    <rect x="121" y="616" width="190" height="58" rx="7" fill="#29415b"/>
    <text x="151" y="655" fill="#fff" font-family="'Yu Gothic',sans-serif" font-size="25" font-weight="700">問題に反映</text>
    <rect x="326" y="616" width="223" height="58" rx="7" fill="#d8e9e7"/>
    <text x="350" y="655" fill="#29415b" font-family="'Yu Gothic',sans-serif" font-size="25" font-weight="700">JSON 読込</text>
    <text x="124" y="733" fill="#647587" font-family="'Yu Gothic',sans-serif" font-size="24">読み  ⇄  書き  を切り替え</text>

    <rect x="604" y="173" width="614" height="626" rx="12" fill="#e9eced" stroke="#d7e1df" stroke-width="2"/>
    <text x="637" y="219" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="31" font-weight="800">02  仕上がりを確認</text>
    <rect x="957" y="187" width="102" height="43" rx="5" fill="#29415b"/>
    <text x="978" y="218" fill="#fff" font-family="'Yu Gothic',sans-serif" font-size="24" font-weight="700">問題</text>
    <rect x="1070" y="187" width="107" height="43" rx="5" fill="#fff" stroke="#bccbd1" stroke-width="2"/>
    <text x="1092" y="218" fill="#29415b" font-family="'Yu Gothic',sans-serif" font-size="24">解答</text>
    <rect x="641" y="257" width="537" height="469" fill="#fff" filter="url(#shadow)"/>
    <path d="M1044 280V703" stroke="#7c8e9a" stroke-width="2"/>
    <text x="1091" y="288" writing-mode="vertical-rl" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="26" font-weight="700">漢字小テスト</text>
    <text x="1084" y="551" writing-mode="vertical-rl" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="19">氏名</text>
    <rect x="1063" y="601" width="75" height="84" fill="none" stroke="#8c9ba3" stroke-width="2"/>
    <text x="984" y="296" writing-mode="vertical-rl" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">一、夜空の星を観察する。</text>
    <text x="920" y="296" writing-mode="vertical-rl" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">二、新しい道を探す。</text>
    <text x="856" y="296" writing-mode="vertical-rl" fill="#24384f" font-family="'Yu Gothic',sans-serif" font-size="28">三、試合の結果を伝える。</text>
    <path d="M779 309V669M749 309V669M719 309V669" stroke="#e4e9e9" stroke-width="2"/>
    <text x="697" y="691" fill="#7f8d94" font-family="'Yu Gothic',sans-serif" font-size="20">A4 横向き・縦書き</text>
  </g>
  <path d="m39 775 21 21 25-47m1179-632 19-20m-8 28 26-6" fill="none" stroke="#7192a3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
